<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Manipulační nástroje</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 class="text-center mb-5">Manipulační nástroje</h1>

<!-- Team has no Tools -->
<div th:if="${#lists.isEmpty(tools)}" class="alert alert-info text-center">
    <p class="mb-3">Tvůj tým zatím nevlastní žádné nástroje.</p>
    <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-primary btn-lg">Zpět na tým</a>
</div>

<form th:if="${!#lists.isEmpty(tools)}" th:action="@{/teams/{teamId}/tools/execute(teamId=${team.id})}" method="post">

    <!-- Team Tools -->
    <h3 class="mb-3">Vyber nástroj:</h3>
    <div class="mb-4" role="group" aria-label="Výběr nástroje">
        <div th:each="tool, iter : ${tools}">
            <input type="radio"
                   class="btn-check"
                   name="toolId"
                   th:id="'tool-' + ${iter.index}"
                   th:value="${tool.id}"
                   th:disabled="${tool.canBeUsedAt > T(java.time.LocalDateTime).now()}"
                   required />
            <label class="card btn btn-outline-warning text-start mb-2"
                   th:for="'tool-' + ${iter.index}"
                   th:attr="data-can-be-used-at=${tool.canBeUsedAt}"
                   style="cursor: pointer;">
                <div class="card-body p-2">
                    <h5 class="card-title mb-1" th:text="${tool.type.label}">Název</h5>
                    <p class="card-text mb-0 small countdown-wrapper">
                        <span class="countdown-label">Nástroj dostupný za:</span>
                        <span class="countdown" th:id="'countdown-' + ${tool.id}"></span>
                    </p>

                </div>
            </label>
        </div>
    </div>

    <!-- Select Country -->
    <h3 class="mt-5 mb-3">Zvol cílovou zemi:</h3>
    <div class="btn-group d-flex flex-wrap gap-2" role="group">
        <div th:each="country, iter : ${countries}">
            <input type="radio"
                   class="btn-check"
                   name="countryId"
                   th:id="'country-' + ${iter.index}"
                   th:value="${country.id}"
                   autocomplete="off"
                   required>
            <label class="btn btn-outline-primary"
                   th:for="'country-' + ${iter.index}"
                   th:text="${country.name}">
            </label>
        </div>
    </div>

    <!-- Back and Submit -->
    <div class="row mt-5">
        <div class="col text-start">
            <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-primary">Zpět na tým</a>
        </div>
        <div class="col text-end">
            <button type="submit" class="btn btn-warning btn-lg" th:disabled="${!gameInProgress}">Použít nástroj</button>
        </div>
    </div>
</form>

<!-- JS for countdown -->
<script>
    function updateCountdowns() {
        document.querySelectorAll('.countdown').forEach(el => {
            const parent = el.closest('label');
            const availableAtStr = parent.getAttribute('data-can-be-used-at');
            if (!availableAtStr) return;

            const availableAt = new Date(availableAtStr);
            const diff = availableAt - new Date();
            if (diff <= 0) {
                el.previousElementSibling.innerText = "Nástroj je dostupný";
                el.remove();
            } else {
                const min = Math.floor(diff / 60000);
                const sec = Math.floor((diff % 60000) / 1000);
                el.innerText = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
            }
        });
    }
    setInterval(updateCountdowns, 1000);
    updateCountdowns();
</script>
</body>
</html>
