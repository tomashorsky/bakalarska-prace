<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Přidat nástroj</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 class="text-center mb-5">Přidat nástroj</h1>

<!-- Team has all tools -->
<div th:if="${#lists.isEmpty(unownedTools)}" class="alert alert-info text-center">
    <p class="mb-3">Tvůj tým vlastní všechny dostupné nástroje.</p>
    <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-primary btn-lg">
        Zpět na tým
    </a>
</div>

<form th:if="${!#lists.isEmpty(unownedTools)}" th:action="@{/teams/{teamId}/tools/add(teamId=${team.id})}" method="post">

    <!-- Tool selection -->
    <h3 class="mb-3">Zvol typ nástroje:</h3>
    <div class="mb-4" role="group" aria-label="Výběr nástroje">
        <div th:each="type,iter : ${unownedTools}">
            <input type="radio"
                   class="btn-check"
                   name="toolType"
                   th:id="'tool-' + ${iter.index}"
                   th:value="${type.name}"
                   required />
            <label class="card btn btn-outline-warning text-start mb-2"
                   th:for="'tool-' + ${iter.index}"
                   style="cursor: pointer;">
                <div class="card-body p-2">
                    <h5 class="card-title mb-1" th:text="${type.label}">Název nástroje</h5>
                    <p class="card-text mb-0 small" th:text="${type.getDescription()}">Popis nástroje</p>
                </div>
            </label>
        </div>
    </div>

    <!-- Back and Submit -->
    <div class="row mt-5">
        <div class="col text-start">
            <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-primary">Zpět na tým</a>
        </div>
        <div class="col text-end">
            <button type="submit" class="btn btn-warning btn-lg"
                    th:disabled="${!gameInProgress}"
                    onclick="return confirm('Opravdu jsi splnil úkol pro získání nástroje?');">
                Přidat nástroj
            </button>
        </div>
    </div>
</form>

</body>
</html>
