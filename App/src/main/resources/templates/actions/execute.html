<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Výběr akce</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<form th:action="@{/teams/{id}/actions/execute(id=${team.id})}" method="post">

    <!-- Select Action -->
    <h3 class="mb-3">Zvol akci:</h3>
    <div class="mb-4 gap-2 d-flex flex-column" role="group" aria-label="Výběr akce">
        <div th:each="type, iter : ${actionTypes}">
            <input type="radio"
                   class="btn-check"
                   name="actionType"
                   th:id="'action-' + ${iter.index}"
                   th:value="${type.name()}"
                   required />

            <label class="card btn btn-outline-primary text-start"
                   th:for="'action-' + ${iter.index}"
                   style="cursor: pointer;">
                <div class="card-body p-2">
                    <h5 class="card-title" th:text="${type.label}">Název</h5>
                    <p class="card-text" th:text="${type.getDescription()}">Popis</p>
                </div>
            </label>
        </div>
    </div>

    <!-- Select Country -->
    <h3 class="mt-5 mb-3">Zvol cílovou zemi:</h3>
    <div class="btn-group d-flex flex-wrap gap-2" role="group">
        <div th:each="country, iter : ${countries}">
            <input type="radio"
                   class="btn-check"
                   name="countryId"
                   th:id="'country-' + ${iter.index}"
                   th:value="${country.id}"
                   autocomplete="off"
                   required>
            <label class="btn btn-outline-primary"
                   th:for="'country-' + ${iter.index}"
                   th:text="${country.name}">
            </label>
        </div>
    </div>

    <!-- Back and Submit -->
    <div class="row mt-5">
        <div class="col text-start">
            <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-primary">Zpět na tým</a>
        </div>
        <div class="col text-end">
            <button type="submit" class="btn btn-danger btn-lg" th:disabled="${!gameInProgress}">Provést akci 🚀</button>
        </div>
    </div>
</form>

</body>
</html>
