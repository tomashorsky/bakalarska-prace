<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Státy</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h1 class="text-center mb-4">Státy ve hře</h1>

<div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" th:each="country : ${countries}">
        <div class="card h-100 shadow">
            <div class="card-body">
                <h4 class="card-title" th:text="${country.name}">Název státu</h4>

                <!-- Názory -->
                <h6 class="mt-3">Názory a následovníci:</h6>
                <ul class="list-group list-group-flush mb-3">
                    <li class="list-group-item"
                        th:each="op : ${country.opinionSupports}"
                        th:text="|${op.opinion}: ${op.supportersCount}|">
                        Názor: Počet
                    </li>
                </ul>

                <!-- Situace -->
                <p class="mb-1"><strong>Ekonomika:</strong> <span th:text="${country.economy.getName()}"></span></p>
                <p class="mb-1"><strong>Mediální gramotnost:</strong> <span th:text="${country.mediaLiteracy.getName()}"></span></p>
                <p><strong>Důvěra ve stát:</strong> <span th:text="${country.trustInState} + ' %'"></span></p>
            </div>
        </div>
    </div>
</div>

<!-- Zpět na hru -->
<div class="mt-5 text-center">
    <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-primary">Zpět na tým</a>
</div>

</body>
</html>
