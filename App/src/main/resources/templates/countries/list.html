<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Státy</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
</head>
<body class="container mt-5">

<h1 class="text-center mb-4">Přehled států</h1>
<h4>TODO: dodat přehled manipulací i s celkovym vysledkem</h4>
<div class="row g-4">
    <div class="col-12 col-md-6 col-lg-4" th:each="country : ${countries}">
        <div class="card h-100 shadow">
            <div class="card-body">
                <h4 class="card-title" th:text="${country.name}">Název státu</h4>

                <!-- Názory jako graf -->
                <div th:if="${country.opinionSupports != null}">
                    <div th:attr="id='chart-country-' + ${country.id}" style="height: 250px;"></div>

                    <!-- Data for graph -->
                    <div th:attr="class='d-none opinions-' + ${country.id}">
                        <div th:each="op : ${country.opinionSupports}"
                             class="opinion"
                             th:attr="data-team=${op.teamName}"
                             th:attrappend="data-supporters=${op.supportersCount},
                             data-color=${op.teamColor}">

                        </div>
                    </div>
                </div>

                <!-- State situation -->
                <p class="mb-1"><strong>Ekonomika:</strong> <span th:text="${country.economy.getName()}"></span></p>
                <p class="mb-1"><strong>Mediální gramotnost:</strong> <span
                        th:text="${country.mediaLiteracy.getName()}"></span></p>
                <p><strong>Důvěra ve stát:</strong>  <span th:text="${#numbers.formatDecimal(country.trustInState, 1, 2)} + ' %'"></span></p>
            </div>
        </div>
    </div>
</div>

<!-- Zpět na hru -->
<div class="mt-5 text-center">
    <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-primary">Zpět na tým</a>
</div>

<!-- Google Charts script -->
<script th:inline="javascript">
    google.charts.load('current', {packages: ['corechart']});
    google.charts.setOnLoadCallback(drawChart);

    function drawChart() {
        const chartContainers = document.querySelectorAll("[id^='chart-country-']");

        chartContainers.forEach(container => {
            const countryId = container.id.replace("chart-country-", "");
            const opinionDataElements = document.querySelectorAll(`.opinions-${countryId} .opinion`);

            if (opinionDataElements.length === 0) {
                return;
            }

            var data = new google.visualization.DataTable();
            data.addColumn('string', 'Tým');
            data.addColumn('number', 'Počet ovilvněných');
            data.addColumn({type: 'string', role: 'style'});

            const rows = [];
            opinionDataElements.forEach(el => {
                const opinion = el.getAttribute('data-team');
                const count = parseInt(el.getAttribute('data-supporters'));
                const color = el.getAttribute('data-color');
                if (!isNaN(count)) {
                    rows.push([opinion, count, `color: ${color}`]);
                }
            });
            data.addRows(rows);

            var options = {
                title: 'Počet ovlivněných občanů v tisících',
                legend: {position: 'none'},
                chartArea: { width: '70%', height: '70%' }, //TODO: set to look good on phone
                tooltip: { isHtml: true }
            };

            const chart = new google.visualization.ColumnChart(container);
            chart.draw(data, options);
        });
    }
</script>


</body>
</html>
