<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Game</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="p-4">
    <h2 class="mb-4">Create Game</h2>
    <form th:action="@{/admin/games}" th:object="${game}" method="post">
        <div class="mb-3">
            <label th:for="numberOfTeams" class="form-label fw-bold">Number of Teams (1-5)</label>
            <input type="number" th:field="*{numberOfTeams}" class="form-control" required min="1" max="5"/>
        </div>

        <div class="mb-3">
            <label th:for="numberOfCountries" class="form-label fw-bold">Number of Countries (1-4, recommended 4)</label>
            <input type="number" th:field="*{numberOfCountries}" class="form-control" required min="1" max="4" />
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary">Create Game</button>
        </div>
    </form>
</div>

</body>
</html>
