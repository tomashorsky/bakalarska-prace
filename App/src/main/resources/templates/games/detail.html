<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Game #' + ${game.id}">Game Detail</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<h2 class="mb-4" th:text="'Game #' + ${game.id} + ' Details'">Game Details</h2>

<!-- Game info -->
<p><strong>Created:</strong>
    <span th:text="${#temporals.format(game.createdAt, 'dd.MM. yyyy')}">Created At</span>
</p>
<p><strong>Game URL:</strong>
    <a id="game-url" th:href="${gameUrl}" th:text="${gameUrl}" target="_blank">Game URL</a>
    <button class="btn btn-sm btn-primary" onclick="copyGameUrl()">Copy</button>
    <span id="copy-msg" class="text-success fw-bold ms-2" style="display: none;">Copied!</span>
</p>

<!-- Change game phase -->
<form th:action="@{/admin/games/{id}/phase(id=${game.id})}" method="post" class="mb-5">
    <div class="row g-2 align-items-center">
        <div class="col-auto">
            <label for="phase" class="col-form-label"><strong>Phase:</strong></label>
        </div>
        <div class="col-auto">
            <select name="phase" id="phase" class="form-select">
                <option th:each="phase : ${T(cz.cvut.fit.data.enums.GamePhase).values()}"
                        th:value="${phase}"
                        th:text="${phase}"
                        th:selected="${phase == game.phase}">
                </option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Change Phase</button>
        </div>
    </div>
</form>

<!-- Teams list -->
<h4>Teams</h4>
<table class="table table-bordered table-hover mb-5">
    <thead class="table-light">
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Manipulation</th>
        <th>Number Of Tools</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="team : ${teams}">
        <td th:text="${team.id}"></td>
        <td>
            <span th:text="${team.name}"></span>
            <span class="ms-2 rounded-circle d-inline-block"
                  th:style="'background-color:' + ${team.colorHex} + '; width: 15px; height: 15px;'">
            </span>
        </td>
        <td th:text="${team.opinion}"></td>
        <td th:text="${team.numberOfTools}"></td>
    </tr>
    </tbody>
</table>

<!-- Countries list  -->
<h4>Countries</h4>
<table class="table table-bordered">
    <thead class="table-light">
    <tr>
        <th>Name</th>
        <th>Media Literacy</th>
        <th>Trust in State</th>
        <th>Economy</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="country : ${countries}">
        <td th:text="${country.name}"></td>
        <td th:text="${country.mediaLiteracy.getName()}"></td>
        <td th:text="${country.trustInState} + ' %'" ></td>
        <td th:text="${country.economy.getName()}"></td>
    </tr>
    </tbody>
</table>

<a th:href="@{/admin/games}" class="btn btn-primary">Back to the Game list</a>

<script>
    function copyGameUrl() {
        const urlText = document.getElementById("game-url").innerText;
        navigator.clipboard.writeText(urlText).then(() => {
            const msg = document.getElementById("copy-msg");
            msg.style.display = "inline";
            setTimeout(() => msg.style.display = "none", 1500);
        });
    }
</script>
</body>
</html>
