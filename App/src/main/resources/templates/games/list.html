<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Game List</title>
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Game List</h1>
    <a th:href="@{/admin/games/new}" class="btn btn-success">+ Add Game</a>
</div>

<table class="table table-bordered text-center align-middle">
    <thead class="table">
    <tr>
        <th>ID</th>
        <th>Created</th>
        <th>Teams</th>
        <th>Countries</th>
        <th>Phase</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="game : ${games}">
        <td th:text="${game.id}"></td>
        <td th:text="${game.createdAt.toLocalDate()}"></td>
        <td th:text="${game.numberOfTeams}"></td>
        <td th:text="${game.numberOfCountries}"></td>
        <td th:text="${game.phase}"></td>
        <td>
            <a th:href="@{/admin/games/{id}(id=${game.id})}" class="btn btn-primary btn-sm">View</a>
            <form th:action="@{/admin/games/{id}(id=${game.id})}" method="post" th:object="${game}" style="display:inline;">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit"
                        class="btn btn-danger btn-sm"
                        onclick="return confirm('Are you sure you want to delete this game?');">
                    Delete
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<script src="/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
