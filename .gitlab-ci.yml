image: maven:3.9.6-eclipse-temurin-21

stages:
  - build
  - test

Build App:
    stage: build
    script:
        - cd App 
        - mvn clean compile

Run tests:
    stage: test
    script:
        - cd App
        - mvn clean test -Dgroups=!db
    artifacts:
      when: always
      paths:
        - App/target/surefire-reports/
      expire_in: 1 day